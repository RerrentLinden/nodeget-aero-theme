<!doctype html>
<meta charset="utf-8">
<title>场景渲染</title>
<style>
body{margin:0;background:#0b1020;color:#cfe8ff;font:12px ui-monospace,Menlo,monospace}
canvas{display:block;width:100%;height:auto}
#s{position:fixed;left:8px;top:8px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.55);white-space:pre-wrap;max-width:92vw}
</style>
<canvas id="c"></canvas><div id="s">…</div>
<script type="module">
// 用法：/__scene/?w=1280&h=720&spp=8&night=0&bands=8
// 逐条带、逐个采样累加（抖动抗锯齿），最后加一层高光溢出。渲染完后 window.__done = true，save('scene-day.webp') 存到 src/。
const q = new URLSearchParams(location.search), W = +(q.get('w') || 1280), H = +(q.get('h') || 720), SPP = +(q.get('spp') || 8);
const MODE = +(q.get('mode') || 0);   // 0 完整成片，1 底图，2 遮罩
const NIGHT = +(q.get('night') || 0), BANDS = +(q.get('bands') || 8), BLOOM = MODE === 2 ? 0 : +(q.get('bloom') ?? .3);
const cv = document.getElementById('c'), st = document.getElementById('s'), say = t => { st.textContent = t; };
cv.width = W; cv.height = H;
const gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
if (!gl) { say('没有 WebGL2'); throw new Error('no webgl2'); }
if (!gl.getExtension('EXT_color_buffer_float')) { say('缺 EXT_color_buffer_float'); throw new Error('no float fbo'); }
const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.-1., 0., 1.); }`;
const HEAD = `#version 300 es
precision highp float; out vec4 O; uniform vec2 uRes;
float h12(vec2 p){ vec3 q = fract(vec3(p.xyx)*.1031); q += dot(q, q.yzx+33.33); return fract((q.x+q.y)*q.z); }`;
const PRESENT = HEAD + `
uniform sampler2D uAcc, uBloom; uniform float uN, uSplit, uK, uRaw;
vec3 knee(vec3 c){ vec3 k = min(c, vec3(.82)); return k+.18*(1.-exp(-max(c-.82, 0.)/.18)); }
void main(){
  float n = gl_FragCoord.y < uSplit ? uN+1. : uN;
  vec3 c = texelFetch(uAcc, ivec2(gl_FragCoord.xy), 0).rgb/max(n, 1.)+texture(uBloom, gl_FragCoord.xy/uRes).rgb*uK;
  if(uRaw > 0.){ O = vec4(c, 1.); return; }
  float l = dot(c, vec3(.2126, .7152, .0722)); c = max(mix(vec3(l), c, 1.1), 0.);
  c = pow(knee(c), vec3(1./2.2))+(h12(gl_FragCoord.xy)-.5)/255.;
  O = vec4(c, 1.);
}`;
const BRIGHT = HEAD + `
uniform sampler2D uAcc; uniform float uN;
void main(){ vec3 s = vec3(0.); ivec2 b = ivec2(gl_FragCoord.xy)*4;
  for(int y = 0; y < 4; y++) for(int x = 0; x < 4; x++) s += max(texelFetch(uAcc, b+ivec2(x, y), 0).rgb/uN-.92, 0.);
  O = vec4(min(s/16., vec3(6.)), 1.); }`;
const BLUR = HEAD + `
uniform sampler2D uT; uniform vec2 uD;
void main(){ vec2 uv = gl_FragCoord.xy/uRes; vec3 s = texture(uT, uv).rgb*.227;
  s += (texture(uT, uv+uD*1.385).rgb+texture(uT, uv-uD*1.385).rgb)*.316+(texture(uT, uv+uD*3.231).rgb+texture(uT, uv-uD*3.231).rgb)*.0703;
  O = vec4(s, 1.); }`;
function prog(fs, name) {
  const p = gl.createProgram();
  for (const [t, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { const log = gl.getShaderInfoLog(s); say(name + ' 编译失败\n' + log); console.error(name, log); throw new Error('compile ' + name); }
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { say(name + ' 链接失败\n' + gl.getProgramInfoLog(p)); throw new Error('link'); }
  return p;
}
const U = (p, n) => gl.getUniformLocation(p, n);
function target(w, h) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR);
  for (const k of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  return { t, f, w, h };
}
const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
const t0 = performance.now();
say('编译着色器…');
const frag = await (await fetch('scene.frag?' + Date.now())).text();
const pScene = prog(frag, 'scene'), pPresent = prog(PRESENT, 'present'), pBright = prog(BRIGHT, 'bright'), pBlur = prog(BLUR, 'blur');
const acc = target(W, H), qa = target(W >> 2, H >> 2), qb = target(W >> 2, H >> 2);
gl.bindVertexArray(gl.createVertexArray());
const bind = (unit, tex) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); };
function present(n, split, k) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(pPresent);
  bind(0, acc.t); bind(1, qa.t);
  gl.uniform1i(U(pPresent, 'uAcc'), 0); gl.uniform1i(U(pPresent, 'uBloom'), 1); gl.uniform2f(U(pPresent, 'uRes'), W, H);
  gl.uniform1f(U(pPresent, 'uN'), n); gl.uniform1f(U(pPresent, 'uSplit'), split); gl.uniform1f(U(pPresent, 'uK'), k); gl.uniform1f(U(pPresent, 'uRaw'), MODE === 2 ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function bloom() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, qa.f); gl.viewport(0, 0, qa.w, qa.h); gl.useProgram(pBright);
  bind(0, acc.t); gl.uniform1i(U(pBright, 'uAcc'), 0); gl.uniform1f(U(pBright, 'uN'), SPP); gl.uniform2f(U(pBright, 'uRes'), qa.w, qa.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.useProgram(pBlur); gl.uniform1i(U(pBlur, 'uT'), 0); gl.uniform2f(U(pBlur, 'uRes'), qa.w, qa.h);
  for (const r of [1, 2.5, 5, 9]) for (const [src, dst, dx, dy] of [[qa, qb, r, 0], [qb, qa, 0, r]]) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f); bind(0, src.t); gl.uniform2f(U(pBlur, 'uD'), dx / qa.w, dy / qa.h); gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}
let s = 0, b = 0;
function frame() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, acc.f); gl.viewport(0, 0, W, H);
  const y0 = Math.floor(H * b / BANDS), y1 = Math.floor(H * (b + 1) / BANDS);
  gl.enable(gl.SCISSOR_TEST); gl.scissor(0, y0, W, y1 - y0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(pScene);
  gl.uniform2f(U(pScene, 'uRes'), W, H); gl.uniform2f(U(pScene, 'uJit'), halton(s + 1, 2) - .5, halton(s + 1, 3) - .5);
  gl.uniform1f(U(pScene, 'uSeed'), s * 17.13 + 1.7); gl.uniform1f(U(pScene, 'uNight'), NIGHT); gl.uniform1f(U(pScene, 'uMode'), MODE);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.BLEND); gl.disable(gl.SCISSOR_TEST);
  if (++b === BANDS) { b = 0; s++; }
}
let fence = null;
function tick() {
  // 一次只交给显卡一小批，等它画完再给下一批，界面不会被卡住
  if (fence) {
    if (gl.clientWaitSync(fence, 0, 0) === gl.TIMEOUT_EXPIRED) { setTimeout(tick, 4); return; }
    gl.deleteSync(fence); fence = null;
  }
  if (s >= SPP) { if (MODE !== 2) bloom(); present(SPP, 0, BLOOM); gl.finish(); window.__done = true; say(`完成 ${W}×${H} · ${SPP} 次采样 · ${((performance.now() - t0) / 1000).toFixed(1)} 秒`); return; }
  for (let k = document.hidden ? 12 : 1; k > 0 && s < SPP; k--) frame();
  fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0); gl.flush();
  present(Math.min(s, SPP), s < SPP ? Math.floor(H * b / BANDS) : 0, 0);
  say(`第 ${Math.min(s + 1, SPP)} / ${SPP} 遍 · ${b} / ${BANDS}`);
  setTimeout(tick, 0);
}
window.save = async name => {
  const blob = await new Promise(r => cv.toBlob(r, name.endsWith('.jpg') ? 'image/jpeg' : name.endsWith('.png') ? 'image/png' : 'image/webp', +(q.get('q') || .9)));
  const r = await fetch('/__save?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
  return name + ' ' + blob.size + ' ' + r.status;
};
setTimeout(tick, 0);
if (!q.has('nolive')) new EventSource('/__live').onmessage = () => location.reload();
</script>
